<!DOCTYPE html>
<html lang="de" data-theme="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Dienstplanung Führungsdienst</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Ladeanzeige beim Start -->
    <div id="appLoader" class="app-loader">
        <div class="app-loader-inner">
            <div class="app-loader-spinner"></div>
            <p>Anwendung wird geladen…</p>
        </div>
    </div>

    <div class="app-shell">

        <!-- Linke Navigationsleiste -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2c-1 3-5 5-5 10a5 5 0 0010 0c0-2-1-3-2-4 .3 1.5-.5 2.5-1.5 2.5-1.4 0-2-1-1.5-2.5.6-1.8 1.5-3 0-6z"/></svg>
                </div>
                <div class="sidebar-brand-text">
                    <strong>Dienstplanung</strong>
                    <span>Führungsdienst</span>
                </div>
            </div>

            <nav id="mainNav" class="sidebar-nav"></nav>

            <div class="sidebar-footer">
                <span id="appVersion">Version</span>
            </div>
        </aside>

        <!-- Hauptbereich -->
        <div class="main-area">
            <header class="top-header">
                <div class="top-header-org">
                    <span id="orgName">Freiwillige Feuerwehr</span>
                    <span id="orgYear" class="top-header-year">Planungsjahr</span>
                </div>
            </header>

            <main id="appContent" class="app-content"></main>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <div id="yearPlanPrintArea" class="year-plan-print-area"></div>

    <!-- Anwendungsmodule (Reihenfolge relevant: Datenbank/Feiertage vor UI/Fachmodulen, app.js zuletzt) -->
    <script src="js/database.js"></script>
    <script src="js/holidays.js"></script>
    <script src="js/wachabteilung.js"></script>
    <script src="js/presence.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/employees.js"></script>
    <script src="js/import.js"></script>
    <script src="js/vacation.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/yearplan.js"></script>
    <script src="js/planner.js"></script>
    <script src="js/statistics.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
